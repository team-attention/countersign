<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countersign ledger</title>
<style>
  :root { --fg:#111; --dim:#777; --line:#e6e6e6; --ok:#0a7d3b; --hold:#a86400; --no:#b3261e; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--fg); background: #fafafa; }
  main { max-width: 920px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 24px; font-family: ui-monospace, monospace; font-size: 12px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 24px; }
  .stat { background: #fff; padding: 14px 16px; }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--dim); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--dim); font-weight: 500; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tag { font-size: 11px; font-weight: 600; letter-spacing: .02em; }
  .AutoPaid, .Approved { color: var(--ok); } .Pending { color: var(--hold); } .Rejected, .Blocked, .Failed { color: var(--no); }
  .notes { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .reason { font-style: italic; }
  .paused { color: var(--no); font-weight: 600; }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input { flex: 1; padding: 8px 10px; border: 1px solid var(--line); font: inherit; }
  button { padding: 8px 14px; border: 1px solid var(--fg); background: var(--fg); color: #fff; font: inherit; cursor: pointer; }
  .err { color: var(--no); }
</style>
</head>
<body>
<main>
  <h1>Countersign ledger</h1>
  <p class="sub" id="who">every payment the agent asked for, and what the wallet decided</p>
  <form id="f">
    <input id="rpc" placeholder="RPC URL" aria-label="RPC URL">
    <input id="wallet" placeholder="wallet account id" aria-label="wallet account id">
    <button>Load</button>
  </form>
  <div class="stats" id="stats"></div>
  <table>
    <thead><tr><th>#</th><th>Decision</th><th>Amount</th><th>To</th><th>Agent's reason · wallet's notes</th></tr></thead>
    <tbody id="rows"><tr><td colspan="5" class="notes">Enter an RPC URL and wallet id, or open with ?rpc=…&amp;wallet=…</td></tr></tbody>
  </table>
</main>
<script>
const q = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
$("rpc").value = q.get("rpc") || "https://test.rpc.fastnear.com";
$("wallet").value = q.get("wallet") || "";

const near = (y) => {
  const v = BigInt(y), u = 10n ** 24n, whole = v / u, frac = ((v % u) / 10n ** 20n).toString().padStart(4, "0").replace(/0+$/, "");
  return frac ? `${whole}.${frac}` : `${whole}`;
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

async function view(rpc, account_id, method_name, args = {}) {
  const r = await fetch(rpc, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "query", params: { request_type: "call_function", finality: "optimistic", account_id, method_name, args_base64: btoa(JSON.stringify(args)) } }),
  }).then((r) => r.json());
  if (r.error || r.result?.error) throw new Error(JSON.stringify(r.error || r.result.error));
  return JSON.parse(new TextDecoder().decode(new Uint8Array(r.result.result)));
}

async function load() {
  const rpc = $("rpc").value.trim(), wallet = $("wallet").value.trim();
  if (!wallet) return;
  history.replaceState(null, "", `?rpc=${encodeURIComponent(rpc)}&wallet=${encodeURIComponent(wallet)}`);
  try {
    const [st, pol, reqs] = await Promise.all([view(rpc, wallet, "get_status"), view(rpc, wallet, "get_policy"), view(rpc, wallet, "list_requests", { limit: 200 })]);
    $("who").innerHTML = `${esc(wallet)} · owner ${esc(st.owner)} · ${st.paused ? '<span class="paused">PAUSED</span>' : "active"}`;
    $("stats").innerHTML = [
      [near(st.balance) + " NEAR", "balance"],
      [near(st.auto_spent_today) + " / " + near(pol.daily_limit), "auto-spent today / daily cap"],
      [near(pol.per_payment_limit) + " NEAR", "per-payment limit"],
      [st.pending, "waiting for the owner"],
    ].map(([b, s]) => `<div class="stat"><b>${esc(b)}</b><span>${s}</span></div>`).join("");
    $("rows").innerHTML = reqs.length ? reqs.map((r) => `<tr>
      <td class="num">${r.id}</td>
      <td><span class="tag ${r.status}">${r.status.replace(/([a-z])([A-Z])/g, "$1 $2").toUpperCase()}</span></td>
      <td class="num">${near(r.amount)} NEAR</td>
      <td>${esc(r.receiver)}</td>
      <td><div class="reason">“${esc(r.reason)}”</div><div class="notes">${r.notes.map(esc).join("<br>")}</div></td>
    </tr>`).join("") : '<tr><td colspan="5" class="notes">no requests yet</td></tr>';
  } catch (e) {
    $("rows").innerHTML = `<tr><td colspan="5" class="err">${esc(e.message)}</td></tr>`;
  }
}
$("f").addEventListener("submit", (e) => { e.preventDefault(); load(); });
load();
setInterval(load, 3000);
</script>
</body>
</html>
